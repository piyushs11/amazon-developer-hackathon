[project]
name = "mcp-bridge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic>=2",
  "httpx",
  "jinja2",
  "boto3",
  "redis",
  "psycopg[binary]",
  # "mcp==<PIN ON DAY 0>",
  # ---- Dev 3: auth + gateway ----
  "pyjwt",
  "cryptography",
  "jsonschema",
  "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx", "ruff", "mcp==2.2.0"]  # mcp: test client only

[tool.setuptools.packages.find]
include = ["backend*", "contracts*", "runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
# integration-test data (expected generated code, sample inputs) is compared byte for byte; never lint/fix it
extend-exclude = ["tests/integration/*/expected", "tests/integration/*/inputs"]

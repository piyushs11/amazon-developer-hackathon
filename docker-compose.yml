services:
  # ---- Dev 1 ----
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mcpbridge
      POSTGRES_PASSWORD: mcpbridge
      POSTGRES_DB: mcpbridge
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]  # registry, connections, encrypted tokens survive rebuilds
    restart: unless-stopped
    healthcheck:  # lets `depends_on: condition: service_healthy` and `up --wait` wait for it
      test: ["CMD-SHELL", "pg_isready -U mcpbridge -d mcpbridge"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ---- Dev 2 ----
  # Tool cache for generation/verification (scratch space; bundles in storage are the durable copy).
  redis:
    image: redis:7
    ports: ["6379:6379"]  # host access for `make dev` (uvicorn on the host) and the tests
    restart: unless-stopped

  catalog:              # mock service catalog: serves the spec JSON that the seed step loads
    build: ./mock-services
    environment: { APP: catalog, PORT: "9200" }
    ports: ["9200:9200"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9200/services')"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ---- Dev 3 ----
  demo-api:             # fake Demo Bistro API
    build: ./mock-services
    environment: { APP: demo-api, PORT: "9000" }
    ports: ["9000:9000"]
    restart: unless-stopped

  oauth:                # fake OAuth provider
    build: ./mock-services
    environment: { APP: oauth, PORT: "9100" }
    ports: ["9100:9100"]
    restart: unless-stopped

  # API + MCP gateway in Docker. Locally `make dev` runs uvicorn on the host instead,
  # so this only starts with a profile: `docker compose --profile app up` (or ec2).
  app:
    profiles: ["app", "ec2"]
    build: { context: ., dockerfile: infra/Dockerfile }
    env_file: [{ path: .env, required: false }]
    environment:
      DATABASE_URL: postgresql://mcpbridge:mcpbridge@postgres:5432/mcpbridge
      # `localhost` inside this container is the app itself, so point at the redis service.
      REDIS_URL: redis://redis:6379/0
      # Real persistence in Docker/AWS (these override .env; `make dev` keeps the memory/fake defaults).
      #   REGISTRY=postgres       -> services come from the seeded registry; nothing is live until publish runs
      #   TOKEN_PROVIDER=secrets  -> per-user OAuth tokens in AWS Secrets Manager
      #                              (mcp-bridge/<service_uuid>/<user_id>); when AWS cannot be reached
      #                              (no credentials, no network, no permission) they go to Postgres,
      #                              encrypted with TOKEN_ENC_KEY. Use `local` to skip AWS entirely
      #                              (APP_TOKEN_PROVIDER=local in .env, e.g. on a laptop).
      REGISTRY: postgres
      TOKEN_PROVIDER: ${APP_TOKEN_PROVIDER:-secrets}
      # boto3 (Bedrock, S3, Secrets Manager, SES) needs a region; Bedrock's default model is a
      # `us.` profile, so keep this a US region. Credentials come from the EC2 instance role.
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      # The registry/spec say localhost:9000/9100; inside Docker the mocks have service names.
      # The gateway applies this to the tools' API calls (base URL is read at call time, not
      # baked into bundles), to verification, and to the OAuth token calls.
      UPSTREAM_REWRITES: http://localhost:9000=http://demo-api:9000,http://localhost:9100=http://oauth:9100
    ports: ["8000:8000"]
    # MODE=local keeps bundles in /app/generated: without a volume a rebuild (deploy.sh) would
    # delete them while the registry still points at them.
    volumes: [generated:/app/generated]
    depends_on:
      postgres: { condition: service_healthy }
      seed: { condition: service_completed_successfully }
      redis: { condition: service_started }
      demo-api: { condition: service_started }
      oauth: { condition: service_started }
    restart: unless-stopped

  # One-shot: parse + map every service in the catalog into the registry (Postgres), so publish()
  # has something to map. Safe to re-run: it only updates spec fields and never touches the
  # active bundle. Runs on every `up` (so on every deploy). Local equivalent: `make seed`.
  seed:
    profiles: ["app", "ec2"]
    build: { context: ., dockerfile: infra/Dockerfile }
    command: ["python", "-m", "backend.app.db.registry.seed"]
    environment:
      DATABASE_URL: postgresql://mcpbridge:mcpbridge@postgres:5432/mcpbridge
      CATALOG_URL: http://catalog:9200
    depends_on:
      postgres: { condition: service_healthy }
      catalog: { condition: service_healthy }
    restart: "no"

  caddy:                # HTTPS on EC2 (needs DOMAIN in .env and DNS pointing here)
    profiles: ["ec2"]
    # Caddy + the built React app (infra/Dockerfile.web), so EC2 needs no Node.
    build: { context: ., dockerfile: infra/Dockerfile.web }
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports: ["80:80", "443:443"]
    volumes:
      - caddy_data:/data
    depends_on: [app]
    restart: unless-stopped

volumes:
  caddy_data:
  pgdata:
  generated:
